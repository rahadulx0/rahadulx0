<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Code with purpose, build with passion, learn without limits.">
  <title>footer</title>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0176d3"/><stop offset=".5" stop-color="#6639ba"/><stop offset="1" stop-color="#bf3989"/></linearGradient>
  </defs>
  <style>
    .w1{animation:mv 14s linear infinite}
    .w2{animation:mv 9s linear infinite reverse}
    .w3{animation:mv 20s linear infinite}
    @keyframes mv{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
    .q{font:italic 500 20px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1f2328}
    .a{font:500 13px 'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;fill:#59636e}
    .in{animation:in 1.2s ease-out .3s both}
    @keyframes in{from{opacity:0}to{opacity:1}}
  </style>
  <g class="in">
