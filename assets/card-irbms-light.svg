<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="IRBMS · Resource &amp; Billing: Internal SaaS for a software agency: hours per project, utilization, over/under-billing guards, auto-emailed PDF invoices and a full audit trail.">
  <title>IRBMS · Resource &amp; Billing</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0176d3"/><stop offset=".5" stop-color="#6639ba"/><stop offset="1" stop-color="#bf3989"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#6639ba" stop-opacity="0.14"/><stop offset=".6" stop-color="#6639ba" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <style>
    .kind{font:700 11px 'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;letter-spacing:1.5px;fill:#6639ba}
    .title{font:700 23px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1f2328;letter-spacing:-.3px}
    .desc{font:400 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#59636e}
    .tag{font:600 11.5px 'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;fill:#1f2328}
    .meta{font:600 12.5px 'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;fill:#59636e}
    .sweep{stroke-dasharray:180 1280;animation:sweep 6s linear infinite}
    @keyframes sweep{to{stroke-dashoffset:-1460}}
    .in{animation:in .7s ease-out .1s both}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .live{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
  </style>
  <rect x="1" y="1" width="478" height="248" rx="16" fill="url(#bg)" stroke="#d0d7de"/>
  <rect x="1" y="1" width="478" height="248" rx="16" fill="url(#glow)"/>
  <rect class="sweep" x="1" y="1" width="478" height="248" rx="16" fill="none" stroke="url(#edge)" stroke-width="2" filter="url(#soft)"/>
  <rect class="sweep" x="1" y="1" width="478" height="248" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <g class="in">
    <text x="26" y="40" class="kind">FULL-STACK SAAS</text>
    <g transform="translate(438 27)" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round"><path d="M2 14 14 2M5 2h9v9"/></g>
    <text x="26" y="72" class="title">IRBMS · Resource &amp; Billing</text>
    <text x="26" y="102" class="desc">Internal SaaS for a software agency: hours per project,</text><text x="26" y="123" class="desc">utilization, over/under-billing guards, auto-emailed PDF</text><text x="26" y="144" class="desc">invoices and a full audit trail.</text>
    <rect x="26" y="200" width="92" height="24" rx="12" fill="#6639ba" fill-opacity=".12" stroke="#6639ba" stroke-opacity=".45"/><text x="72" y="216.5" text-anchor="middle" class="tag">Next.js 14</text><rect x="126" y="200" width="70.4" height="24" rx="12" fill="#6639ba" fill-opacity=".12" stroke="#6639ba" stroke-opacity=".45"/><text x="161.2" y="216.5" text-anchor="middle" class="tag">Express</text><rect x="204.4" y="200" width="56" height="24" rx="12" fill="#6639ba" fill-opacity=".12" stroke="#6639ba" stroke-opacity=".45"/><text x="232.4" y="216.5" text-anchor="middle" class="tag">MySQL</text><rect x="268.4" y="200" width="48.8" height="24" rx="12" fill="#6639ba" fill-opacity=".12" stroke="#6639ba" stroke-opacity=".45"/><text x="292.79999999999995" y="216.5" text-anchor="middle" class="tag">RBAC</text>
    <g text-anchor="end">
      <text x="454" y="216.5" class="meta">OPEN SOURCE</text>
    </g>
  </g>
</svg>
