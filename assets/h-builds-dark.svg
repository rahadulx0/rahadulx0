<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 64" width="840" height="64" role="img" aria-label="featured builds">
  <title>featured builds</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00a1e0"/><stop offset=".5" stop-color="#8957e5"/><stop offset="1" stop-color="#f778ba" stop-opacity="0"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .n{font:700 14px 'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;fill:#00a1e0}
    .h{font:800 28px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#e6edf3;letter-spacing:-.5px}
    .s{font:400 13px 'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;fill:#8b949e}
    .sh{animation:sh 4s ease-in-out infinite}
    @keyframes sh{0%{transform:translateX(-120px)}60%,100%{transform:translateX(840px)}}
  </style>
  <text x="2" y="38" class="n">04 /</text>
  <text x="46" y="40" class="h">featured builds</text>
  <text x="836" y="39" text-anchor="end" class="s">// things I've shipped</text>
  <rect x="2" y="56" width="836" height="2" rx="1" fill="url(#g)"/>
  <rect class="sh" x="0" y="55" width="100" height="4" rx="2" fill="url(#shine)" opacity="0.6"/>
