<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Rahadul Islam · Salesforce Developer @ Inovi Solutions">
  <title>Rahadul Islam</title>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#0176d3"/><stop offset=".5" stop-color="#6639ba"/><stop offset="1" stop-color="#bf3989"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;700 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="core" cx=".35" cy=".35" r=".75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".35" stop-color="#0176d3"/><stop offset="1" stop-color="#6639ba"/>
    </radialGradient>
    <radialGradient id="fade" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gridMask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0b1220" stroke-opacity="0.12"/></pattern>
    <clipPath id="frame"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>
  <style>
  .b1{animation:drift1 18s ease-in-out infinite alternate}
  .b2{animation:drift2 22s ease-in-out infinite alternate}
  .b3{animation:drift3 26s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(120px,60px)}}
  @keyframes drift2{to{transform:translate(-140px,40px)}}
  @keyframes drift3{to{transform:translate(160px,-50px)}}
    .mono{font-family:'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace}
    .prompt{font:500 18px 'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;fill:#59636e}
    .name{font:800 76px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:-2px}
    .role{font:500 22px 'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;fill:#1f2328}
    .node{font:600 12px 'JetBrains Mono', 'Fira Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;fill:#1f2328}
    .pill{font:600 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1f2328}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .in{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .pulse{animation:pulse 2s ease-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes pulse{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(3)}}
    .spin{animation:spin 30s linear infinite;transform-origin:950px 215px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .float{animation:float 6s ease-in-out infinite alternate}
    @keyframes float{to{transform:translateY(-8px)}}
  </style>
